version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: finwise-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=financial_advisor
    volumes:
      - mongo_data:/data/db
    networks:
      - finwise-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: finwise-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/financial_advisor
      - JWT_SECRET=dev-secret-change-in-production
      - JWT_ACCESS_EXPIRY=15m
      - JWT_REFRESH_EXPIRY=7d
      - ML_SERVICE_URL=http://ml-service:8000
      - ML_SERVICE_TIMEOUT=5000
      - CORS_ORIGIN=http://localhost:5173
      - NODE_ENV=development
    depends_on:
      - mongo
    volumes:
      - ./server:/app
      - /app/node_modules
    networks:
      - finwise-network

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: finwise-ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./ml-service:/app
    networks:
      - finwise-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: finwise-client
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - server
    volumes:
      - ./client:/app
      - /app/node_modules
    networks:
      - finwise-network

volumes:
  mongo_data:

networks:
  finwise-network:
    driver: bridge
