# ==========================================
# Render Blueprint Specification for FinWise
# ==========================================
services:
  # ── 1. Python ML Microservice (FastAPI) ──
  - type: web
    name: finwise-ml
    runtime: python
    rootDir: ml-service
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ML_MODEL_VERSION
        value: 1.0.0

  # ── 2. Node.js Express REST API ─────────
  - type: web
    name: finwise-api
    runtime: node
    rootDir: server
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # Set in Render dashboard (MongoDB Atlas connection string)
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      - key: CLIENT_URL
        sync: false # Set in Render dashboard to your finwise-web URL (e.g. https://finwise-web.onrender.com)
      - key: CORS_ORIGIN
        sync: false # Automatically matches CLIENT_URL
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: finwise-ml
          property: host
      - key: ML_SERVICE_TIMEOUT
        value: 15000

  # ── 3. React Vite Static Site ───────────
  - type: web
    name: finwise-web
    runtime: static
    rootDir: client
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # Set in Render dashboard to your finwise-api URL (e.g. https://finwise-api.onrender.com)
